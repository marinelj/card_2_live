<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080, DUR = 57.4;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const BRAND = 'CardPlay';
const C = {
  ink: '#F4F6FB', dim: '#9AA3B8', faint: '#5B6680',
  orange: '#FF7A1A', gold: '#F5C451', blue: '#7AB4FF', teal: '#2ED3B7',
};
const MONO = 'DejaVu Sans Mono';

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, a, b) => clamp((t - a) / (b - a));
const eo = t => 1 - Math.pow(1 - t, 3);
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eback = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// ---------- licensed footage (see ASSETS.md) ----------
function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('missing ' + src)); i.src = src; }); }
const pad3 = n => String(n).padStart(3, '0');
const A = { clip: [], full: [], tiles: [], bridge: [] };
function drawCover(g, im, x, y, w, h, z = 1, fx = .5, fy = .5) {
  const s = Math.max(w / im.width, h / im.height) * z, iw = im.width * s, ih = im.height * s;
  g.drawImage(im, x + (w - iw) * fx, y + (h - ih) * fy, iw, ih);
}

function rr(g, x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function txt(g, s, x, y, o = {}) {
  const { size = 32, weight = 600, color = C.ink, align = 'left', alpha = 1, font = 'Inter', base = 'alphabetic', ls = 0 } = o;
  g.save(); g.globalAlpha *= alpha; g.font = `${weight} ${size}px ${font}`; g.fillStyle = color;
  g.textAlign = align; g.textBaseline = base; g.letterSpacing = ls + 'px'; g.fillText(s, x, y); g.restore();
}
function measure(g, s, size, weight = 600, font = 'Inter', ls = 0) {
  g.save(); g.font = `${weight} ${size}px ${font}`; g.letterSpacing = ls + 'px'; const w = g.measureText(s).width; g.restore(); return w;
}
function shade(hex, f) { const n = parseInt(hex.slice(1), 16); return `rgb(${(n >> 16) * f | 0},${(n >> 8 & 255) * f | 0},${(n & 255) * f | 0})`; }
function check(g, x, y, s, color) {
  g.save(); g.strokeStyle = color; g.lineWidth = s * 0.16; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(x - s * .35, y); g.lineTo(x - s * .08, y + s * .27); g.lineTo(x + s * .38, y - s * .3); g.stroke(); g.restore();
}

// ---------- the (fictional) card ----------
const CARD = document.createElement('canvas'); CARD.width = 700; CARD.height = 980;
const REG = {};
function drawCardArt(g, w, h, photo = A.card) {
  const r = w * .05;
  const gr = g.createLinearGradient(0, 0, w, h);
  [[0, '#FFF0B3'], [.25, '#D9A93A'], [.5, '#FFF4C8'], [.75, '#C48F2C'], [1, '#8E5F16']].forEach(([o, c]) => gr.addColorStop(o, c));
  rr(g, 0, 0, w, h, r); g.fillStyle = gr; g.fill();
  const m = w * .045, iw = w - 2 * m, ih = h - 2 * m;
  g.save(); rr(g, m, m, iw, ih, r * .55); g.clip();
  const bg = g.createLinearGradient(m, m, m + iw * .4, m + ih);
  bg.addColorStop(0, '#1C3C86'); bg.addColorStop(.55, '#2B165E'); bg.addColorStop(1, '#0A0D24');
  g.fillStyle = bg; g.fillRect(m, m, iw, ih);
  drawCover(g, photo, m, m, iw, ih, 1.02, .5, .3);
  // foil sheen + set colourway over the photo
  const tint = g.createLinearGradient(m, m, m + iw, m + ih);
  tint.addColorStop(0, 'rgba(255,196,90,0.16)'); tint.addColorStop(.5, 'rgba(255,255,255,0)'); tint.addColorStop(1, 'rgba(60,40,140,0.28)');
  g.fillStyle = tint; g.fillRect(m, m, iw, ih);
  const top = g.createLinearGradient(0, m, 0, m + ih * .2); top.addColorStop(0, 'rgba(5,8,20,0.7)'); top.addColorStop(1, 'rgba(5,8,20,0)');
  g.fillStyle = top; g.fillRect(m, m, iw, ih * .2);
  const np = g.createLinearGradient(0, m + ih * .74, 0, m + ih);
  np.addColorStop(0, 'rgba(5,8,20,0)'); np.addColorStop(.35, 'rgba(5,8,20,0.88)'); np.addColorStop(1, 'rgba(5,8,20,0.96)');
  g.fillStyle = np; g.fillRect(m, m + ih * .74, iw, ih * .26);
  g.restore();
  // name plate
  const nx = m + iw * .06, ny = m + ih * .885, ns = w * .085;
  txt(g, 'KAI MERCER', nx, ny, { size: ns, weight: 800, ls: w * .004 });
  txt(g, 'HARBOR CITY COMETS  ·  F', nx, m + ih * .94, { size: w * .034, weight: 600, color: '#C9CFDF', ls: w * .003 });
  const nw = Math.max(measure(g, 'KAI MERCER', ns, 800, 'Inter', w * .004), measure(g, 'HARBOR CITY COMETS  ·  F', w * .034, 600, 'Inter', w * .003));
  REG.name = [(nx - 10) / w, (ny - ns * .82) / h, (nw + 20) / w, (m + ih * .955 - (ny - ns * .82)) / h];
  // serial
  const sx = m + iw * .94, sy = m + ih * .905, ss = w * .05;
  txt(g, '12/50', sx, sy, { size: ss, weight: 800, color: C.gold, align: 'right' });
  const sw = measure(g, '12/50', ss, 800);
  REG.serial = [(sx - sw - 10) / w, (sy - ss * .85) / h, (sw + 20) / w, (ss * 1.1) / h];
  // set logo
  const lx = m + iw * .06, ly = m + ih * .075, ls2 = w * .05;
  txt(g, 'PRIME', lx, ly, { size: ls2, weight: 900, color: C.gold, ls: w * .01 });
  txt(g, '2025–26', lx, m + ih * .112, { size: w * .03, weight: 600, color: '#E8D9A8' });
  const lw = measure(g, 'PRIME', ls2, 900, 'Inter', w * .01);
  REG.set = [(lx - 10) / w, (ly - ls2 * .85) / h, (lw + 20) / w, (m + ih * .125 - (ly - ls2 * .85)) / h];
  // rookie badge
  const bx = m + iw * .8, by = m + ih * .035, bw = iw * .15, bh = ih * .085;
  g.beginPath(); g.moveTo(bx, by); g.lineTo(bx + bw, by); g.lineTo(bx + bw, by + bh * .62); g.lineTo(bx + bw / 2, by + bh); g.lineTo(bx, by + bh * .62); g.closePath();
  const bgr = g.createLinearGradient(bx, by, bx + bw, by + bh); bgr.addColorStop(0, '#FFE7A0'); bgr.addColorStop(1, '#C7922E');
  g.fillStyle = bgr; g.fill();
  txt(g, 'RC', bx + bw / 2, by + bh * .56, { size: bw * .42, weight: 900, color: '#1A1030', align: 'center' });
  REG.rc = [(bx - 8) / w, (by - 8) / h, (bw + 16) / w, (bh + 16) / h];
}

const TMP = document.createElement('canvas'); TMP.width = 700; TMP.height = 980; const tg = TMP.getContext('2d');
// Card rotated about its vertical axis with true perspective, drawn as thin vertical slices.
function drawCard3D(g, cx, cy, ch, ang, shim = -1, glow = 0, src = CARD) {
  tg.clearRect(0, 0, 700, 980); tg.drawImage(src, 0, 0);
  tg.save(); rr(tg, 0, 0, 700, 980, 35); tg.clip();
  if (shim >= 0 && shim <= 1) {
    tg.globalCompositeOperation = 'lighter';
    const x = lerp(-600, 1300, shim);
    const gr = tg.createLinearGradient(x - 300, 0, x + 300, 420);
    gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(.42, 'rgba(255,220,160,0.10)');
    gr.addColorStop(.5, 'rgba(255,255,255,0.5)'); gr.addColorStop(.58, 'rgba(150,200,255,0.12)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    tg.fillStyle = gr; tg.fillRect(0, 0, 700, 980); tg.globalCompositeOperation = 'source-over';
  }
  const dark = (1 - Math.cos(ang)) * .55;
  if (dark > 0.005) { tg.fillStyle = `rgba(0,0,0,${dark})`; tg.fillRect(0, 0, 700, 980); }
  tg.restore();
  const cw = ch / 1.4, N = 80, f = cw * 2.4, ca = Math.cos(ang), sa = Math.sin(ang);
  g.save(); g.filter = 'blur(28px)'; g.fillStyle = 'rgba(0,0,0,0.55)';
  g.beginPath(); g.ellipse(cx, cy + ch * .5, cw * .55 * Math.abs(ca) + 30, ch * .05, 0, 0, 7); g.fill(); g.restore();
  if (glow > 0) {
    const gg = g.createRadialGradient(cx, cy, ch * .1, cx, cy, ch * .85);
    gg.addColorStop(0, `rgba(255,150,50,${.35 * glow})`); gg.addColorStop(1, 'rgba(255,150,50,0)');
    g.fillStyle = gg; g.fillRect(cx - ch, cy - ch, ch * 2, ch * 2);
  }
  for (let i = 0; i < N; i++) {
    const u0 = i / N - .5, u1 = (i + 1) / N - .5;
    const p0 = f / (f + u0 * cw * sa), p1 = f / (f + u1 * cw * sa);
    const x0 = cx + u0 * cw * ca * p0, x1 = cx + u1 * cw * ca * p1;
    const hh = ch * (p0 + p1) / 2;
    g.drawImage(TMP, i * 700 / N, 0, 700 / N, 980, Math.min(x0, x1), cy - hh / 2, Math.abs(x1 - x0) + .7, hh);
  }
}

// ---------- clips (licensed footage) ----------
// AI transition: a bullet-time camera orbit from the clip's break point (44455, under the rim) to the card moment (44448, side angle).
// The player is a cut-out layer (Mask R-CNN); the gym is lifted to 3D with Depth Anything V2 (tools/orbit3.py). Frames are stored card-first.
function bridgeFrame(i) { return A.bridge[clamp(Math.floor(i), 0, A.bridge.length - 1)]; }
function aiBadge(g, x, y, label, a = 1, size = 15) {
  g.save(); g.globalAlpha *= a;
  const bw = measure(g, label, size, 800) + size * 2.6, bh = size * 2;
  rr(g, x, y, bw, bh, bh / 2); g.fillStyle = 'rgba(4,33,28,0.85)'; g.fill(); g.strokeStyle = C.teal; g.lineWidth = 2; g.stroke();
  g.fillStyle = C.teal; const sx = x + size * 1.05, sy = y + bh / 2, r = size * .45;
  g.beginPath(); g.moveTo(sx, sy - r); g.quadraticCurveTo(sx, sy, sx + r, sy); g.quadraticCurveTo(sx, sy, sx, sy + r); g.quadraticCurveTo(sx, sy, sx - r, sy); g.quadraticCurveTo(sx, sy, sx, sy - r); g.fill();
  txt(g, label, x + size * 1.9, y + bh / 2 + size * .36, { size, weight: 800, color: C.teal });
  g.restore(); return bw;
}
function aiScan(g, w, h, u) {
  const y = h * u; const gr = g.createLinearGradient(0, y - 60, 0, y + 4);
  gr.addColorStop(0, 'rgba(46,211,183,0)'); gr.addColorStop(1, 'rgba(46,211,183,0.35)');
  g.fillStyle = gr; g.fillRect(0, y - 60, w, 64); g.fillStyle = 'rgba(160,255,239,0.9)'; g.fillRect(0, y - 1, w, 2);
  g.strokeStyle = 'rgba(46,211,183,0.9)'; g.lineWidth = 4; g.strokeRect(2, 2, w - 4, h - 4);
}
// ---------- footage tiles ----------
const TILE_LABELS = ['Q1 · Layup', 'Q4 · Dunk', 'Q2 · Steal', 'Q3 · Assist', 'Q2 · Free throw', 'Q1 · Rebound', 'Q3 · Three-pointer', 'Q4 · Timeout', 'Q2 · Fast break', 'Q1 · Jump ball', 'Q4 · Block', 'Q3 · Inbound'];
const TILE_DUR = ['0:06', '0:08', '0:05', '0:07', '0:04', '0:06', '0:07', '0:09', '0:06', '0:05', '0:06', '0:04'];
const SELECTED = [1];
let TILES = [];
function buildTiles() { TILES = TILE_LABELS.map((lab, i) => {
  const c = document.createElement('canvas'); c.width = 600; c.height = 338; const g = c.getContext('2d');
  g.drawImage(A.tiles[i], 0, 0, 600, 338);
  const gr = g.createLinearGradient(0, 220, 0, 338); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.8)');
  g.fillStyle = gr; g.fillRect(0, 200, 600, 138);
  txt(g, lab, 24, 312, { size: 30, weight: 700 });
  rr(g, 600 - 96, 286, 76, 34, 8); g.fillStyle = 'rgba(0,0,0,0.6)'; g.fill();
  txt(g, TILE_DUR[i], 600 - 58, 311, { size: 22, weight: 600, align: 'center', color: '#DDE2EE' });
  return c;
}); }

// ---------- shared UI ----------
function bg(t) {
  const g = ctx.createRadialGradient(W * .5, H * .42, 40, W * .5, H * .5, W * .78);
  g.addColorStop(0, '#121C3D'); g.addColorStop(1, '#04060D'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const blob = (x, y, r, c) => { const b = ctx.createRadialGradient(x, y, 0, x, y, r); b.addColorStop(0, c); b.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = b; ctx.fillRect(x - r, y - r, 2 * r, 2 * r); };
  blob(W * (.18 + .04 * Math.sin(t * .3)), H * .28, 560, 'rgba(255,122,26,0.10)');
  blob(W * .82, H * (.72 + .05 * Math.cos(t * .25)), 640, 'rgba(76,141,255,0.11)');
  ctx.fillStyle = 'rgba(255,255,255,0.035)';
  for (let x = 24; x < W; x += 48) for (let y = 24; y < H; y += 48) ctx.fillRect(x, y, 2, 2);
}
function header(num, title, sub, lt) {
  const a = eo(P(lt, .1, .6)), dy = (1 - a) * 24;
  txt(ctx, 'STEP ' + num, 160, 150 + dy, { size: 26, weight: 700, color: C.orange, ls: 5, alpha: a });
  txt(ctx, title, 160, 228 + dy, { size: 72, weight: 800, alpha: a });
  txt(ctx, sub, 160, 282 + dy, { size: 32, weight: 500, color: C.dim, alpha: P(lt, .3, .8) });
}
function drawPhone(cx, cy, sh, screenFn) {
  const sw = sh * 9 / 16, b = 16, pw = sw + 2 * b, ph = sh + 2 * b;
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 80; ctx.shadowOffsetY = 40;
  rr(ctx, cx - pw / 2, cy - ph / 2, pw, ph, 62); ctx.fillStyle = '#0B0D13'; ctx.fill();
  ctx.shadowColor = 'transparent'; ctx.lineWidth = 3; ctx.strokeStyle = '#2C3346'; ctx.stroke();
  const sx = cx - sw / 2, sy = cy - sh / 2;
  ctx.save(); rr(ctx, sx, sy, sw, sh, 48); ctx.clip(); ctx.translate(sx, sy); screenFn(ctx, sw, sh); ctx.restore();
  rr(ctx, cx - 58, sy + 14, 116, 34, 17); ctx.fillStyle = '#000'; ctx.fill();
  ctx.restore();
  return { sx, sy, sw, sh };
}
function chip(g, x, y, label, o = {}) {
  const size = o.size || 26, padX = 22, h = size * 1.75;
  const w = measure(g, label, size, 600) + padX * 2 + (o.check ? size : 0);
  g.save(); g.globalAlpha *= (o.alpha ?? 1);
  rr(g, x, y, w, h, h / 2); g.fillStyle = o.fill || 'rgba(255,255,255,0.07)'; g.fill();
  g.strokeStyle = o.stroke || 'rgba(255,255,255,0.18)'; g.lineWidth = 2; g.stroke();
  let tx = x + padX;
  if (o.check) { check(g, tx + size * .35, y + h / 2, size * .8, o.color || C.teal); tx += size; }
  txt(g, label, tx, y + h / 2 + size * .36, { size, weight: 600, color: o.color || C.ink });
  g.restore();
  return w;
}

// ---------- phone screens ----------
function camAffine(w, h, lt) {
  const j = Math.sin(lt * 2.1) * 4, k = Math.cos(lt * 1.7) * 3;
  return new DOMMatrix().translate(w * .5 + j, h * .5 + k).rotate(-12).skewX(10).scale(1, .86);
}
function cameraView(g, w, h, lt) {
  const gr = g.createLinearGradient(0, 0, w, h); gr.addColorStop(0, '#3B2B1F'); gr.addColorStop(1, '#17100B');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.strokeStyle = 'rgba(0,0,0,0.2)';
  for (let i = 0; i < 26; i++) { const y = i * h / 26; g.lineWidth = 1 + i % 3; g.beginPath(); g.moveTo(0, y + Math.sin(i) * 8); g.bezierCurveTo(w * .3, y + 12, w * .7, y - 12, w, y + Math.cos(i) * 8); g.stroke(); }
  const lamp = g.createRadialGradient(w * .3, h * .2, 0, w * .3, h * .2, h * .7); lamp.addColorStop(0, 'rgba(255,220,170,0.18)'); lamp.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = lamp; g.fillRect(0, 0, w, h);
  const ch = h * .48, cw = ch / 1.4, m = camAffine(w, h, lt);
  g.save(); g.transform(m.a, m.b, m.c, m.d, m.e, m.f);
  g.shadowColor = 'rgba(0,0,0,0.6)'; g.shadowBlur = 30; g.shadowOffsetY = 14;
  g.drawImage(CARD, -cw / 2, -ch / 2, cw, ch); g.restore();
  const corners = [[-cw / 2, -ch / 2], [cw / 2, -ch / 2], [cw / 2, ch / 2], [-cw / 2, ch / 2]].map(([x, y]) => m.transformPoint({ x, y }));
  const screenC = [[40, 110], [w - 40, 110], [w - 40, h - 170], [40, h - 170]];
  const u = eio(P(lt, 1.4, 2.4)), lock = lt >= 2.4;
  const pts = corners.map((c, i) => [lerp(screenC[i][0], c.x, u), lerp(screenC[i][1], c.y, u)]);
  if (lock) {
    g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath();
    g.fillStyle = `rgba(46,211,183,${.1 + .06 * Math.sin(lt * 10)})`; g.fill();
    g.strokeStyle = 'rgba(46,211,183,0.9)'; g.lineWidth = 3; g.stroke();
  }
  g.strokeStyle = lock ? C.teal : '#FFFFFF'; g.lineWidth = 5; g.lineCap = 'round';
  const L = 26, dirs = [[1, 1], [-1, 1], [-1, -1], [1, -1]];
  pts.forEach((p, i) => { const [dx, dy] = dirs[i]; g.beginPath(); g.moveTo(p[0] + dx * L, p[1]); g.lineTo(p[0], p[1]); g.lineTo(p[0], p[1] + dy * L); g.stroke(); });
  if (lt > 2.5) {
    const a = P(lt, 2.5, 2.8);
    const top = Math.min(...pts.map(p => p[1]));
    const cx = pts.reduce((s, p) => s + p[0], 0) / 4;
    g.save(); g.globalAlpha *= a;
    const lw = measure(g, 'Card detected', 20, 700) + 40;
    rr(g, cx - lw / 2, top - 58, lw, 38, 19); g.fillStyle = C.teal; g.fill();
    txt(g, 'Card detected', cx, top - 32, { size: 20, weight: 700, color: '#04211C', align: 'center' });
    g.restore();
  }
  // camera chrome
  rr(g, w / 2 - 80, 62, 160, 36, 18); g.fillStyle = 'rgba(0,0,0,0.45)'; g.fill();
  txt(g, 'Scan a card', w / 2, 86, { size: 18, weight: 600, align: 'center' });
  g.fillStyle = 'rgba(0,0,0,0.5)'; g.fillRect(0, h - 140, w, 140);
  const press = lt > 3.05 && lt < 3.3 ? .82 : 1;
  g.strokeStyle = '#fff'; g.lineWidth = 5; g.beginPath(); g.arc(w / 2, h - 72, 36, 0, 7); g.stroke();
  g.fillStyle = '#fff'; g.beginPath(); g.arc(w / 2, h - 72, 28 * press, 0, 7); g.fill();
  if (lt > 3.1 && lt < 3.5) { g.fillStyle = `rgba(255,255,255,${1 - P(lt, 3.1, 3.5)})`; g.fillRect(0, 0, w, h); }
  if (lt > 3.5) {
    const a = P(lt, 3.5, 3.8), p = eio(P(lt, 3.7, 4.8));
    g.save(); g.globalAlpha *= a;
    g.fillStyle = 'rgba(4,6,13,0.55)'; g.fillRect(0, 0, w, h);
    rr(g, 24, h - 190, w - 48, 104, 20); g.fillStyle = 'rgba(18,24,44,0.96)'; g.fill();
    txt(g, p < 1 ? 'Identifying card…' : 'Card identified', 48, h - 146, { size: 22, weight: 700 });
    rr(g, 48, h - 122, w - 96, 10, 5); g.fillStyle = 'rgba(255,255,255,0.12)'; g.fill();
    rr(g, 48, h - 122, (w - 96) * p, 10, 5); g.fillStyle = C.teal; g.fill();
    g.restore();
  }
}
function revealBg(g, w, h, t) {
  const gr = g.createRadialGradient(w / 2, h * .45, 10, w / 2, h * .5, h * .7); gr.addColorStop(0, '#2A1A4A'); gr.addColorStop(1, '#06070F');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.save(); g.translate(w / 2, h * .45); g.rotate(t * .25);
  for (let i = 0; i < 16; i++) { g.rotate(Math.PI * 2 / 16); g.beginPath(); g.moveTo(0, 0); g.lineTo(h, -h * .06); g.lineTo(h, h * .06); g.closePath(); g.fillStyle = i % 2 ? 'rgba(255,190,90,0.05)' : 'rgba(120,160,255,0.035)'; g.fill(); }
  g.restore();
